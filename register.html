<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - lory</title>
</head>
<body>
    <h1>Create an account:</h1>
    <form>
        <input type="text" id="form-name_in" placeholder="Name" required>
        <input type="email" id="form-em_in" placeholder="Email" required>
        <input type="password" id="form-ps1_in" placeholder="Password" required>
        <input type="password" id="form-ps2_in" placeholder="Repeat Password" required>
        <p id="form-msg"></p>
        <input type="button" id="form-crt_acc_btn" value="Create account">
        <p>Already have an account? <a href="/login">Login</a></p>
    </form>
</body>
<script src="./register.js"></script>
</html>
